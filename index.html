<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Management Software (TMS)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #18bc9c;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --dark: #34495e;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f8f9fa; color: var(--dark); display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Main Layout Header */
        header { background-color: var(--primary); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .user-toggle-panel { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; }
        .toggle-btn { background: #7f8c8d; color: white; border: none; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .toggle-btn.active-role { background: var(--secondary); }
        
        /* Navigation Tabs */
        nav { background-color: var(--dark); display: flex; padding: 0 20px; }
        .tab-btn { background: none; border: none; color: #a6b0b9; padding: 15px 20px; font-size: 16px; cursor: pointer; transition: 0.2s; border-bottom: 3px solid transparent; }
        .tab-btn:hover { color: white; }
        .tab-btn.active { color: white; border-bottom-color: var(--secondary); font-weight: bold; }
        
        /* Sub Navigation Bars */
        .sub-nav { background: #e2e7ec; padding: 10px 25px; display: flex; gap: 10px; border-bottom: 1px solid #ccd1d9; }
        .sub-btn { background: white; border: 1px solid #ccd1d9; padding: 6px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .sub-btn.active { background: var(--secondary); color: white; border-color: var(--secondary); }

        /* Container & Grid Layouts */
        .container { padding: 25px; flex: 1; max-width: 1400px; width: 100%; margin: 0 auto; }
        .view-panel { display: none; }
        .view-panel.active { display: block; }
        .sub-view-panel { display: none; }
        .sub-view-panel.active { display: block; }
        
        /* Cards */
        .card { background: white; padding: 20px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .card h3 { margin-bottom: 20px; color: var(--primary); border-bottom: 2px solid var(--light); padding-bottom: 10px; }
        
        /* Form Inputs */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 14px; font-weight: 600; color: #555; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 100%; }
        input:focus, select:focus { border-color: var(--secondary); outline: none; }
        .btn { background-color: var(--secondary); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-block; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background-color: var(--danger); }
        
        /* Tables */
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #e0e0e0; }
        th { background-color: #f4f6f7; color: var(--primary); font-weight: 600; }
        tr:hover { background-color: #fcfcfc; }
        
        /* Status Badges */
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-danger { background-color: #fadbd8; color: #c0392b; }
        .badge-success { background-color: #d4efdf; color: #27ae60; }
    </style>
</head>
<body>

    <!-- TOP HEADER & INTEGRATED WORKSPACE SELECTOR -->
    <header>
        <h2>Tool Management Platform</h2>
        <div class="user-toggle-panel">
            <span style="font-size:13px; font-weight:600; margin-right:5px;">Workspace View:</span>
            <button id="toggle-admin" class="toggle-btn active-role" onclick="changeWorkspace('admin')">Store Admin</button>
            <button id="toggle-prod" class="toggle-btn" onclick="changeWorkspace('production')">Production</button>
        </div>
    </header>

    <!-- Main Tab Menu -->
    <nav id="main-nav">
        <button id="nav-masters" class="tab-btn active" onclick="switchTab('masters')">Masters</button>
        <button id="nav-transactions" class="tab-btn" onclick="switchTab('transactions')">Transaction</button>
        <button id="nav-reports" class="tab-btn" onclick="switchTab('reports')">Report</button>
    </nav>

    <!-- Master Sub-Tabs -->
    <div id="sub-nav-masters" class="sub-nav">
        <button id="sub-btn-part" class="sub-btn active" onclick="switchSubTab('masters', 'part-master')">Part Master</button>
        <button id="sub-btn-supplier" class="sub-btn" onclick="switchSubTab('masters', 'supplier-master')">Supplier Master</button>
        <button id="sub-btn-wc" class="sub-btn" onclick="switchSubTab('masters', 'work-centre')">Work Centre</button>
        <button id="sub-btn-loc" class="sub-btn" onclick="switchSubTab('masters', 'location-master')">Location Master</button>
    </div>

    <!-- Transaction Sub-Tabs -->
    <div id="sub-nav-transactions" class="sub-nav" style="display:none;">
        <button id="sub-nav-inward" class="sub-btn active" onclick="switchSubTab('transactions', 'material-inward')">Material Inward</button>
        <button id="sub-nav-outward" class="sub-btn" onclick="switchSubTab('transactions', 'material-outward')">Material Outward</button>
    </div>

    <div class="container">
        <!-- TAB MODULE 1: MASTERS STATIONS -->
        <div id="view-masters" class="view-panel active">
            <!-- 1A: Part Master Entry Panel (Form tags removed completely) -->
            <div id="sub-view-part-master" class="sub-view-panel active">
                <div class="card">
                    <h3>Register New Tool Part</h3>
                    <div class="form-grid">
                        <div class="form-group"><label>Part Name</label><input type="text" id="part-name" placeholder="e.g. Drill" required></div>
                        <div class="form-group"><label>Part Number</label><input type="text" id="part-number" placeholder="e.g. 0001" required></div>
                        <div class="form-group"><label>Min Qty</label><input type="number" id="part-min" value="10" required></div>
                        <div class="form-group"><label>Max Qty</label><input type="number" id="part-max" value="100" required></div>
                        <div class="form-group"><label>ROL (Re-Order Level)</label><input type="number" id="part-rol" value="25" required></div>
                        <div class="form-group"><label>Safety Stock</label><input type="number" id="part-safety" value="15" required></div>
                        <div class="form-group"><label>Lead Time (Days)</label><input type="number" id="part-lead" value="5" required></div>
                    </div>
                    <button type="button" class="btn" onclick="savePart()">Add to Registry</button>
                </div>
                <div class="card">
                    <h3>Part Master Records</h3>
                    <div class="table-responsive"><table><thead><tr><th>Part Name</th><th>Part Number</th><th>Min</th><th>Max</th><th>ROL</th><th>Safety Stock</th><th>Lead Time</th><th>Action</th></tr></thead><tbody id="table-parts"></tbody></table></div>
                </div>
            </div>

            <!-- 1B: Supplier Registry Panel -->
            <div id="sub-view-supplier-master" class="sub-view-panel">
                <div class="card">
                    <h3>Register New Supplier</h3>
                    <div class="form-grid">
                        <div class="form-group"><label>Supplier Name</label><input type="text" id="sup-name" required></div>
                        <div class="form-group"><label>Contact Name</label><input type="text" id="sup-contact" required></div>
                        <div class="form-group"><label>Contact No</label><input type="text" id="sup-phone" required></div>
                        <div class="form-group"><label>Email</label><input type="email" id="sup-email" required></div>
                        <div class="form-group"><label>Address</label><input type="text" id="sup-address" required></div>
                    </div>
                    <button type="button" class="btn" onclick="saveSupplier()">Add Supplier</button>
                </div>
                <div class="card">
                    <h3>Supplier List</h3>
                    <div class="table-responsive"><table><thead><tr><th>Supplier Name</th><th>Contact</th><th>Phone</th><th>Email</th><th>Address</th><th>Action</th></tr></thead><tbody id="table-suppliers"></tbody></table></div>
                </div>
            </div>

            <!-- 1C: Machine / Work Centre Panel -->
            <div id="sub-view-work-centre" class="sub-view-panel">
                <div class="card">
                    <h3>Register Work Centre Machine</h3>
                    <div class="form-grid">
                        <div class="form-group"><label>Machine Name</label><input type="text" id="wc-name" required></div>
                        <div class="form-group"><label>Machine No</label><input type="text" id="wc-no" required></div>
                        <div class="form-group"><label>Work Centre No</label><input type="text" id="wc-num" required></div>
